[package]
name = "instadesk"
version = "0.1.0"
description = "An unofficial privacy-focused Instagram desktop wrapper"
authors = ["InstaDesk contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "instadesk_lib"
crate-type = ["rlib", "cdylib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
notify-rust = "4.18"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
arboard = "3"
tauri-plugin-global-shortcut = "2.3.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[profile.dev]
debug = 1
incremental = true

[profile.dev.package."*"]
opt-level = 2
debug = 0
